# ============================================================================
# Build the Windows installer on a real Windows runner.
#
# The final packaging steps — stamping version metadata and the icon into the
# .exe (rcedit) and building the NSIS installer — are Windows binaries.
# electron-builder can shim them through wine on Linux, but that needs 32-bit
# wine, so a Linux CI box is the wrong tool for the last mile. A windows-latest
# runner does it natively, with nothing to shim.
#
# The renderer is NOT vendored here. It is built from the web repo so the
# installer always ships the POS that repo currently produces, and the two can
# never drift.
# ============================================================================
name: Build Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      pos_ref:
        description: 'Branch or tag of digitaltarget.digital to package (blank = its default branch)'
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the desktop shell
        uses: actions/checkout@v4
        with:
          path: shell

      # github.token is scoped to THIS repository. If digitaltarget.digital is
      # private, the checkout below answers 404 — which reads as "the branch
      # does not exist" rather than "this job may not read that repository".
      # Say which one it is before the confusing failure, not after.
      - name: Check the cross-repository token
        shell: bash
        env:
          HAS_PAT: ${{ secrets.POS_REPO_TOKEN != '' }}
        run: |
          if [ "$HAS_PAT" = "true" ]; then
            echo "POS_REPO_TOKEN is set — the POS repository will be read with it."
          else
            echo "::warning::POS_REPO_TOKEN is not set. github.token can only read THIS"\
                 "repository, so checking out digitaltarget.digital will 404 if it is"\
                 "private. Add a repo-scoped PAT as the POS_REPO_TOKEN secret."
          fi

      - name: Check out the POS web app
        uses: actions/checkout@v4
        with:
          repository: dtpos2026/digitaltarget.digital
          # ===== v1.28.4 — this said 'main', and there is no main =====
          #
          # The POS repository has exactly one branch, and it is not called
          # main. So this checkout could not resolve its ref and the job died
          # at step two, before Node was even installed — every time, for as
          # long as the workflow has existed. That is the whole of "the Windows
          # app is not building".
          #
          # Blank means "that repository's default branch", which stays correct
          # when the branch is renamed or main is finally created. A tag push
          # (on: push: tags) supplies its own ref, which is the release case.
          ref: ${{ github.event.inputs.pos_ref }}
          path: pos
          token: ${{ secrets.POS_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shell/package-lock.json

      # The Supabase keys are compiled into the renderer bundle. They are the
      # PUBLISHABLE keys — the same ones the website already serves to every
      # browser — never the service-role key, which must not exist in CI.
      - name: Build the POS client bundle
        working-directory: pos
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npm ci
          npm run build:desktop

      - name: Install shell dependencies
        working-directory: shell
        run: npm ci

      - name: Stage the renderer
        working-directory: shell
        env:
          DTPOS_RENDERER: ${{ github.workspace }}\pos\dist-desktop\client
        run: npm run renderer

      # ===== v1.28.4 — the tests ran before the thing they test existed =====
      #
      # `npm test` imports out/shared/channels.js and resolves an asset under
      # renderer/. Both are build outputs, and this step used to run BEFORE the
      # renderer was staged and before the shell was compiled — so two of the
      # security tests failed on every run with ERR_MODULE_NOT_FOUND and "a
      # normal asset must resolve". They pass on a developer's machine, where
      # a previous build has already left both directories in place, which is
      # why it only ever showed up here.
      #
      # Compile first, stage first, then test what will actually be packaged.
      - name: Build the shell
        working-directory: shell
        run: npm run build

      - name: Typecheck and test
        working-directory: shell
        run: |
          npm run typecheck
          npm test

      # Through scripts/build-windows.mjs, not electron-builder directly: the
      # script sets CSC_IDENTITY_AUTO_DISCOVERY=false, which is what keeps the
      # winCodeSign archive — and its macOS .dylib SYMLINKS, which Windows
      # refuses to create without SeCreateSymbolicLinkPrivilege — out of the
      # build. A runner that happens to hold any code-signing certificate would
      # otherwise reach for it and fail with "Cannot create symbolic link".
      - name: Build the installer
        working-directory: shell
        run: npm run dist:clean

      - name: Show what was produced
        working-directory: shell
        shell: pwsh
        run: |
          $files = Get-ChildItem release -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $files) { Write-Error "No installer was produced."; exit 1 }
          $files | ForEach-Object { "{0}  {1:N2} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: DT-POS-Windows
          path: |
            shell/release/*.exe
            shell/release/*.blockmap
          if-no-files-found: error
