# ============================================================================
# Windows packaging for DT POS.
#
# Two artifacts, on purpose:
#   nsis      the installer a restaurant runs once, per-machine so a shared
#             till works for every Windows user account
#   portable  a single .exe for a machine where installing is not allowed
# ============================================================================
appId: digital.digitaltarget.dtpos
productName: DT POS
copyright: Copyright © Digital Target

directories:
  output: release
  buildResources: build

# Only the compiled shell ships. No TypeScript sources, no dev dependencies.
files:
  - out/**/*
  - package.json
  - '!**/*.map'

# The POS client bundle is copied in by scripts/sync-renderer.mjs and served
# from resources/renderer over app://.
extraResources:
  - from: renderer
    to: renderer

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.png
  artifactName: DT-POS-Setup-${version}.${ext}
  # No signing certificate is configured. Windows SmartScreen will warn on
  # first run until one is added here — see README.
  verifyUpdateCodeSignature: false
  # ===== v1.28.2 — the winCodeSign symlink trap =====
  #
  # Leave rcedit ON: it stamps the version and icon into the .exe, and on
  # Windows electron-builder runs it through its own bundled binary, which
  # involves no symlinks.
  #
  #     signAndEditExecutable: false   <- would also disable rcedit; do not.
  #
  # What DOES pull in the archive full of macOS .dylib symlinks is the SIGNING
  # step, and electron-builder reaches it by auto-discovering a certificate
  # from the Windows certificate store. On a machine that happens to hold one,
  # extraction fails with "Cannot create symbolic link: A required privilege is
  # not held by the client" — which is why the same repo builds on one PC and
  # not another.
  #
  # `npm run dist` goes through scripts/build-windows.mjs, which sets
  # CSC_IDENTITY_AUTO_DISCOVERY=false so signing is skipped and the archive is
  # never fetched. Build with DT_ALLOW_SIGNING=1 once a certificate is real.
  signAndEditExecutable: true

nsis:
  oneClick: false                 # a till operator should see where it installs
  perMachine: true                # shared machine: every Windows user gets it
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DT POS
  installerIcon: build/icon.png
  uninstallerIcon: build/icon.png
  # Leaves userData (the offline JSON store and the sync queue) in place, so an
  # upgrade never costs a restaurant its unsynced bills.
  deleteAppDataOnUninstall: false

portable:
  artifactName: DT-POS-Portable-${version}.${ext}

# Disabled deliberately. The POS already owns the update decision: it compares
# its APP_VERSION against getAppVersion() and calls downloadAndRunInstaller().
# Turning on electron-updater as well would give a till two update mechanisms
# racing each other.
publish: null
